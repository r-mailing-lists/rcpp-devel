name: Update Archive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_redownload:
        description: 'Force re-download all mbox files (not just current month)'
        type: boolean
        default: false
      periods:
        description: 'Periods to download again, space separated (for example: 2026-July 2026q2)'
        type: string
        default: ''
      max_requests:
        description: 'Source pages: requests this run may make, with no limit on periods. This is how history is fetched. Leave empty for an ordinary run. Used only where a sources/ directory exists.'
        type: string
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check source page inputs
        env:
          FORCE: ${{ inputs.force_redownload }}
          PERIODS: ${{ inputs.periods }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: |
          # This runs before anything is downloaded, so a refusal leaves nothing to commit.
          # It is the one place that decides what a valid max_requests is.
          if [ ! -d sources ]; then
            exit 0
          fi
          case "$MAX_REQUESTS" in
            *[!0-9]*) echo "::error::max_requests must be a whole number, got '$MAX_REQUESTS'"; exit 1 ;;
          esac
          if [ "${#MAX_REQUESTS}" -gt 4 ]; then
            echo "::error::max_requests must have at most four digits, got '$MAX_REQUESTS'"; exit 1
          fi
          # A budget that is empty or all zeros indexes nothing, so it does not count as set.
          if [ -z "${MAX_REQUESTS//0/}" ] && { [ "$FORCE" = "true" ] || [ -n "${PERIODS//[[:space:]]/}" ]; }; then
            echo "::error::This repository has sources/. A run that downloads periods again must set max_requests to more than zero, so that the periods are indexed again before they are parsed."
            exit 1
          fi

      - name: Download latest mbox files
        env:
          FORCE: ${{ inputs.force_redownload }}
          PERIODS: ${{ inputs.periods }}
          MAILMAN_USERNAME: ${{ secrets.MAILMAN_USERNAME }}
          MAILMAN_PASSWORD: ${{ secrets.MAILMAN_PASSWORD }}
        run: |
          # Both secrets set: the archive is members-only, and the step logs in first.
          # Neither set (a public archive): no login, no cookie, the requests are the same
          # as ever. One of the two set is a mistake, caught before any request is made.
          # Nothing secret is printed: no tracing, and curl is never verbose.
          if [ -n "$MAILMAN_USERNAME" ] && [ -z "$MAILMAN_PASSWORD" ]; then
            echo "::error::MAILMAN_USERNAME is set but MAILMAN_PASSWORD is not. Set both secrets to log in, or neither."; exit 1
          fi
          if [ -z "$MAILMAN_USERNAME" ] && [ -n "$MAILMAN_PASSWORD" ]; then
            echo "::error::MAILMAN_PASSWORD is set but MAILMAN_USERNAME is not. Set both secrets to log in, or neither."; exit 1
          fi

          LIST_NAME=$(jq -r '.list' config.json)
          BASE_URL=$(jq -r '.source_url' config.json)

          # Extra curl options: empty for a public archive, the cookie jar for a members-only one.
          # GZ is for gunzip. Mailman's private archive hands out the text of a .gz file, not
          # the gzip bytes, so a logged-in download may be plain text; -f lets that through.
          # The check below that the file starts with "From " still decides what is saved.
          AUTH=(); GZ=()
          if [ -n "$MAILMAN_USERNAME" ]; then
            # The password goes to source_url, so it must not travel in clear.
            case "$BASE_URL" in
              https://*|http://127.0.0.1:*) ;;
              *) echo "::error::source_url must start with https:// to log in, so that the password is not sent in clear."; exit 1 ;;
            esac
            JAR=$(mktemp)
            trap 'rm -f "$JAR"' EXIT
            # Mailman 2.1 answers a wrong password with the login form again and no cookie,
            # so the jar is what tells a login from a failed one.
            if ! curl -sS -o /dev/null -c "$JAR" \
              --data-urlencode "username=$MAILMAN_USERNAME" \
              --data-urlencode "password=$MAILMAN_PASSWORD" \
              --data-urlencode "submit=Let me in..." "$BASE_URL"; then
              echo "::error::Could not reach $BASE_URL to log in."
              exit 1
            fi
            if ! awk -F'\t' 'NF >= 7 { found = 1 } END { exit !found }' "$JAR"; then
              echo "::error::Could not log in to $BASE_URL: the server set no cookie. Check the MAILMAN_USERNAME and MAILMAN_PASSWORD secrets."
              exit 1
            fi
            AUTH=(-b "$JAR"); GZ=(-cf)
          fi

          mkdir -p raw

          # Fetch the current and the previous period again (a message can reach the
          # source after its period's last run), any period named in PERIODS, and any
          # file we do not have yet. Handles monthly (2026-July), quarterly (2026q3),
          # and annual (2026).
          Y=$(date -u +%Y); MON=$((10#$(date -u +%m)))
          MONTHS=(_ January February March April May June July August September October November December)
          QUARTER=$(( (MON - 1) / 3 + 1 ))
          CUR_MONTH="${Y}-${MONTHS[$MON]}"; CUR_QUARTER="${Y}q${QUARTER}"
          PREV_Y=$((Y - 1))
          if [ "$MON" -eq 1 ]; then PREV_MONTH="${PREV_Y}-December"; else PREV_MONTH="${Y}-${MONTHS[$((MON - 1))]}"; fi
          if [ "$QUARTER" -eq 1 ]; then PREV_QUARTER="${PREV_Y}q4"; else PREV_QUARTER="${Y}q$((QUARTER - 1))"; fi
          WANTED=" $(printf '%s' "$PERIODS" | tr -s '[:space:]' ' ') "

          # The loop below runs in a pipeline subshell; the stems it sees are kept in a file.
          LISTED=$(mktemp)
          curl -sL "${AUTH[@]}" "$BASE_URL" | \
            grep -oE 'href="[^"]*\.txt(\.gz)?"' | \
            sed 's/href="//;s/"//' | \
            while read -r archive; do
              URL="${BASE_URL%/}/$archive"
              BASENAME=$(basename "$archive")
              MBOX_NAME="${BASENAME%.gz}"
              MBOX_NAME="${MBOX_NAME%.txt}.mbox"
              STEM="${BASENAME%.gz}"; STEM="${STEM%.txt}"
              echo "$STEM" >> "$LISTED"

              if [ "$FORCE" != "true" ] && [ -f "raw/$MBOX_NAME" ] \
                 && [ "$STEM" != "$CUR_MONTH" ] && [ "$STEM" != "$PREV_MONTH" ] \
                 && [ "$STEM" != "$CUR_QUARTER" ] && [ "$STEM" != "$PREV_QUARTER" ] \
                 && [ "$STEM" != "$Y" ] && [ "$STEM" != "$PREV_Y" ]; then
                case "$WANTED" in
                  *" $STEM "*) ;;
                  *) continue ;;
                esac
              fi

              echo "Downloading $BASENAME..."
              # Replace the existing file only with a complete download that starts like an mbox.
              TMP=$(mktemp)
              if [[ "$archive" == *.gz ]]; then
                if ( set -o pipefail; curl -fsSL "${AUTH[@]}" "$URL" | gunzip "${GZ[@]}" > "$TMP" ) && [ -s "$TMP" ]; then OK=true; else OK=false; fi
              else
                if curl -fsSL "${AUTH[@]}" "$URL" -o "$TMP" && [ -s "$TMP" ]; then OK=true; else OK=false; fi
              fi
              if [ "$OK" = true ] && [ "$(head -c 5 "$TMP")" = "From " ]; then
                mv "$TMP" "raw/$MBOX_NAME"
              else
                rm -f "$TMP"
                if [ -f "raw/$MBOX_NAME" ]; then
                  echo "::warning::Could not download $BASENAME, kept the existing raw/$MBOX_NAME as it was"
                else
                  echo "::warning::Could not download $BASENAME, raw/$MBOX_NAME was not created"
                fi
              fi
            done

          # A requested period that is not in the listing was probably mistyped.
          set -f
          for requested in $PERIODS; do
            grep -qxF -- "$requested" "$LISTED" || echo "::warning::Period $requested is not in the listing at $BASE_URL"
          done
          set +f
          # With a login, a listing that names no archive means the cookie gave no access.
          # For a public archive an empty listing is left alone, as it always was.
          if [ -n "$MAILMAN_USERNAME" ] && [ ! -s "$LISTED" ]; then
            rm -f "$LISTED"
            echo "::error::The listing at $BASE_URL names no .txt or .txt.gz file, so the login gave no access to the archive."
            exit 1
          fi
          rm -f "$LISTED"

      - name: Download rmail-parser
        run: |
          curl -sL -o rmail-parser \
            "https://github.com/r-mailing-lists/rmail-parser/releases/latest/download/rmail-parser-linux-x86_64"
          chmod +x rmail-parser

      - name: Download aliases
        run: |
          curl -sL -o aliases.json \
            "https://raw.githubusercontent.com/r-mailing-lists/rmail-parser/main/aliases.json" \
            2>/dev/null || echo '{"aliases":[]}' > aliases.json

      - name: Fetch source pages
        env:
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: |
          # Source pages are on only in a repository that has a sources/ directory.
          # Committing that directory switches them on; removing it switches them off.
          # They are for public archives only: the parser sends no cookie, so a
          # members-only list must not have a sources/ directory.
          if [ ! -d sources ]; then
            exit 0
          fi
          BASE_URL=$(jq -r '.source_url' config.json)
          if [ -z "$MAX_REQUESTS" ]; then
            # An ordinary run: a small budget, and only the two newest periods,
            # the ones downloaded again above. It never walks into history.
            ./rmail-parser sources --raw raw/ --out sources/ --base-url "$BASE_URL" --max-requests 50 --max-periods 2
          else
            # Started by hand with a budget, already checked above: every period, newest
            # first, until it is spent.
            ./rmail-parser sources --raw raw/ --out sources/ --base-url "$BASE_URL" --max-requests "$MAX_REQUESTS"
          fi

      - name: Parse mbox files
        run: |
          LIST_NAME=$(jq -r '.list' config.json)
          mkdir -p processed
          if [ -d sources ]; then
            BASE_URL=$(jq -r '.source_url' config.json)
            ./rmail-parser parse --input raw/ --output processed/ --list "$LIST_NAME" --aliases aliases.json --sources sources/ --base-url "$BASE_URL"
          else
            ./rmail-parser parse --input raw/ --output processed/ --list "$LIST_NAME" --aliases aliases.json
          fi
          mv processed/meta.json meta.json
          mv processed/index.json index.json
          mv processed/message-order.json message-order.json
          mv processed/contributors.json contributors.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw/ processed/ meta.json index.json message-order.json contributors.json
          if [ -d sources ]; then
            # A run that was cut off can leave a temporary file behind. It is never committed.
            find sources -name '*.json.tmp' -delete
            git add sources/
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update archive $(date +%Y-%m-%d)"
            git push
          fi
